name: release

# Build prebuilt `scrub` binaries for macOS and Linux and attach them to the
# GitHub Release when a v* tag is pushed. The install.sh bootstrap downloads
# these assets, so their names must stay `scrub-<target>.tar.gz`.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Build
        run: cargo build --release --bin scrub --target ${{ matrix.target }}
      - name: Package
        run: |
          tar -C target/${{ matrix.target }}/release -czf scrub-${{ matrix.target }}.tar.gz scrub
          shasum -a 256 scrub-${{ matrix.target }}.tar.gz > scrub-${{ matrix.target }}.tar.gz.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            scrub-${{ matrix.target }}.tar.gz
            scrub-${{ matrix.target }}.tar.gz.sha256

  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - name: Install cross
        run: cargo install cross --locked
      - name: Build (static musl via cross)
        run: cross build --release --bin scrub --target ${{ matrix.target }}
      - name: Package
        run: |
          tar -C target/${{ matrix.target }}/release -czf scrub-${{ matrix.target }}.tar.gz scrub
          sha256sum scrub-${{ matrix.target }}.tar.gz > scrub-${{ matrix.target }}.tar.gz.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            scrub-${{ matrix.target }}.tar.gz
            scrub-${{ matrix.target }}.tar.gz.sha256
