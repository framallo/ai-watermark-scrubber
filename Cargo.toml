[package]
name = "ai-watermark-scrubber"
version = "0.1.0"
edition = "2021"
description = "Detect and remove multi-vendor AI text watermarks — invisible-Unicode carriers and stray provenance metadata — from text and EPUB files. Usable as a CLI (`scrub`) and as a Rust library (`scrub`)."
license = "MIT"
repository = "https://github.com/framallo/ai-watermark-scrubber"
keywords = ["ai", "watermark", "unicode", "epub", "sanitize"]
categories = ["command-line-utilities", "text-processing"]

# The binary and library keep the short, generic name `scrub` on purpose: build
# pipelines invoke `scrub` and Rust consumers write `use scrub::…`, while the
# crate/repo name advertises what it does.
[[bin]]
name = "scrub"
path = "src/main.rs"

[lib]
name = "scrub"
path = "src/lib.rs"

[profile.release]
strip = true
lto = true

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-general-category = "1"
unicode-normalization = "0.1"
# EPUB is a ZIP container; match bookmill's zip major so behavior is consistent.
zip = { version = "2", default-features = false, features = ["deflate"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"
